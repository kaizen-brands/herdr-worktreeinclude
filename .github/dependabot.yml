version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    assignees: ["pauljohnchamberlain"]
    open-pull-requests-limit: 2
    groups:
      routine:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      major-compatibility:
        applies-to: version-updates
        update-types: [major]
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    assignees: ["pauljohnchamberlain"]
    open-pull-requests-limit: 2
    groups:
      routine:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      major-compatibility:
        applies-to: version-updates
        update-types: [major]
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
