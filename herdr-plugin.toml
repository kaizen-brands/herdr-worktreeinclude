id = "herdr-worktreeinclude"
name = "Worktree Include"
version = "0.2.0"
min_herdr_version = "0.7.0"
description = "On worktree.created, copy gitignored files listed in .worktreeinclude from the source checkout into the new worktree."
platforms = ["linux", "macos"]

# On `herdr plugin install`, download the prebuilt binary for this platform from
# the matching GitHub Release into bin/ (no Rust toolchain needed). Skipped by
# `herdr plugin link` — for a local checkout, build with cargo (see README).
[[build]]
command = ["bash", "install-prebuilt.sh"]

[[events]]
on = "worktree.created"
command = ["./bin/herdr-worktreeinclude", "on-worktree-created"]

[[actions]]
id = "apply"
title = "Apply .worktreeinclude"
description = "Copy .worktreeinclude-selected gitignored files into the focused worktree"
contexts = ["workspace"]
command = ["./bin/herdr-worktreeinclude", "apply"]
