id = "kaizen.herdr-worktreeinclude"
name = "Kaizen Worktree Include"
version = "0.3.0"
min_herdr_version = "0.7.0"
description = "Copy .worktreeinclude files and create canonical Kaizen worktrees from Herdr."
platforms = ["linux", "macos"]

# On `herdr plugin install`, download the prebuilt binary for this platform from
# the matching GitHub Release into bin/ (no Rust toolchain needed). Skipped by
# `herdr plugin link` — for a local checkout, build with cargo (see README).
[[build]]
command = ["bash", "install-prebuilt.sh"]

[[events]]
on = "worktree.created"
command = ["./bin/herdr-worktreeinclude", "on-worktree-created"]

[[actions]]
id = "apply"
title = "Apply .worktreeinclude"
description = "Copy .worktreeinclude-selected gitignored files into the focused worktree"
contexts = ["workspace"]
command = ["./bin/herdr-worktreeinclude", "apply"]

[[actions]]
id = "create"
title = "Create Kaizen worktree"
description = "Create a canonical Kaizen worktree and open it in Herdr"
contexts = ["workspace"]
command = ["./bin/herdr-worktreeinclude", "create-kaizen-worktree"]
