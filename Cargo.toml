[package]
name = "herdr-worktreeinclude"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin: copy .worktreeinclude-selected gitignored files into new worktrees"
license = "MIT"
publish = false

[lib]
name = "herdr_worktreeinclude"
path = "src/lib.rs"

[[bin]]
name = "herdr-worktreeinclude"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
